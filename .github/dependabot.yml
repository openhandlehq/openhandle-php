version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: 'chore(deps)'
      groups:
          composer-dependencies:
              patterns: ['*']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: 'chore(deps)'
      groups:
          github-actions:
              patterns: ['*']
